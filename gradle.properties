org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Ordinary builds are non-discoverable scaffolds. Use tools/build_runnable_provider.ps1
# to produce a native/provider-enabled APK whose signer is checked against AutoJs6.
autojs.lua.native.enabled=false
autojs.lua.provider.enabled=false
autojs.lua.faultHarness.enabled=false
autojs.lua.releaseCandidate.enabled=false
